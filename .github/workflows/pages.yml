name: Pages 배포

# main에 올라가면 테스트를 돌리고, 통과하면 GitHub Pages로 배포한다.
# 워크플로의 GITHUB_TOKEN은 Pages 사이트를 새로 만들 권한이 없다. 처음 한 번은
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 직접 켜야 한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 시뮬 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 결정론과 리플레이 일치가 여기서 깨지면 배포하지 않는다.
      - run: node --test tests/sim.test.mjs

  deploy:
    name: 배포
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 배포할 파일만 모은다
        # 개발 도구(tools, tests)와 설계 문서는 게시하지 않는다.
        run: |
          mkdir -p dist
          cp index.html style.css .nojekyll dist/
          cp -r js dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
